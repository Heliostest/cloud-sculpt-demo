<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Sculpt Raymarch Demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #canvas { width: 100%; height: 100%; display: block; }
      .lil-gui.lil-root { --width: 360px; max-height: 100vh; }
      .lil-gui.lil-root > .lil-title { display: flex; align-items: center; gap: 5px; }
      .gui-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gui-toolbar-select {
        padding: 1px 4px;
        border: 1px solid #555;
        border-radius: 3px;
        background: #2a2a2a;
        color: #ddd;
        font: 11px sans-serif;
        cursor: pointer;
      }
      .gui-mode { margin-left: auto; }
      .gui-help {
        margin-left: 4px;
        color: #7fb6ee;
        font-size: 11px;
        font-weight: 400;
        line-height: 1;
        cursor: help;
        opacity: 0.85;
      }
      .lil-gui .lil-controller .lil-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lil-gui .lil-controller:hover .gui-help,
      .lil-gui .lil-title:hover .gui-help { color: #b8dcff; opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
